<style>
  /* Layout: a 1970s mission-control console. A square survey scope is the stage, the mission card sits beneath it, and the home screen is a route map from Earth outward. Deliberately single-theme: space is dark. */
  :root {
    color-scheme: dark;
    --void: #070a1c;
    --deck: #0e1330;
    --deck-2: #161d45;
    --rule: #2b3468;
    --ink: #e9edf8;
    --ink-dim: #a6a9c6;
    --flare: #ff7a3d;
    --flare-hi: #ffb36b;
    --alert: #ff5470;
    --ghost: #a9d3ff;
    --f-display: "Michroma", "Eurostile", "Arial Black", sans-serif;
    --f-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
    --f-data: "Space Mono", ui-monospace, "SFMono-Regular", monospace;
    --scope: min(90vw, 46vh, 440px);
    --cls: var(--flare-hi);
  }
  html, body { height: 100%; }
  body {
    background:
      radial-gradient(90% 60% at 50% -10%, #1a2260 0%, transparent 60%),
      var(--void);
    background-attachment: fixed;
    color: var(--ink);
    font-family: var(--f-body);
    font-size: 16px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--flare-hi); outline-offset: 3px; }
  [tabindex="-1"]:focus { outline: none; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  #app {
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(10px, 2vh, 16px);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 12px 28px;
  }

  /* ---------- header ---------- */
  .bar {
    width: 100%;
    max-width: 820px;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 12px;
  }
  .brand { justify-self: start; font-family: var(--f-display); font-size: 15px; letter-spacing: 0.28em; color: var(--flare-hi); white-space: nowrap; }
  .pips { justify-self: center; display: flex; align-items: center; gap: 6px; }
  .pip { width: 12px; height: 12px; border-radius: 3px; background: var(--deck-2); box-shadow: inset 0 0 0 1.5px var(--rule); }
  .pip.is-now { box-shadow: inset 0 0 0 2px var(--flare-hi); }
  .pip.is-miss { background: transparent; box-shadow: inset 0 0 0 1.5px var(--rule); position: relative; }
  .pip.is-miss::after { content: ""; position: absolute; left: 2px; right: 2px; top: 5px; height: 2px; background: var(--ink-dim); transform: rotate(45deg); }
  .cell { width: 6px; height: 16px; border-radius: 2px; background: var(--flare-hi); }
  .cell.is-low { background: var(--alert); }
  .cell.is-empty { background: var(--deck-2); box-shadow: inset 0 0 0 1px var(--rule); }
  .pips-label { font-family: var(--f-data); font-size: 12px; color: var(--ink-dim); margin-left: 6px; }
  .bar-right { justify-self: end; display: flex; align-items: center; gap: 10px; }
  .readout { font-family: var(--f-data); font-weight: 700; font-size: 18px; color: var(--ink); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .readout small { font-weight: 400; font-size: 12px; color: var(--ink-dim); margin-left: 2px; }
  .icon-btn {
    width: 38px; height: 38px; border-radius: 10px;
    display: grid; place-items: center;
    background: var(--deck);
    border: 1.5px solid var(--rule);
    color: var(--flare-hi);
  }
  .icon-btn:hover { border-color: var(--flare); }
  .icon-btn svg { width: 18px; height: 18px; }
  .is-home .pips, .is-home #btn-end, .is-home .readout { visibility: hidden; }

  /* ---------- scope ---------- */
  .stage { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .scope {
    position: relative;
    width: var(--scope);
    max-width: 100%;
    aspect-ratio: 1;
    background: #02030a;
    border-radius: 6px;
    box-shadow: 0 0 0 1px var(--rule), 0 0 0 5px #0b1030, 0 0 0 6px #2b3468, 0 24px 60px rgba(0,0,0,0.6);
    overflow: hidden;
  }
  .scope canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .scope::before {
    content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 3;
    background: radial-gradient(circle at 50% 50%, transparent 62%, rgba(0,0,0,0.45) 100%);
  }
  .scope::after { content: ""; position: absolute; inset: 0; z-index: 3; pointer-events: none; background: linear-gradient(135deg, rgba(255,255,255,0.07), transparent 38%); }
  .bracket { position: absolute; width: 22px; height: 22px; z-index: 4; pointer-events: none; border-color: rgba(255,179,107,0.75); border-style: solid; border-width: 0; }
  .bracket.tl { top: 8px; left: 8px; border-top-width: 2px; border-left-width: 2px; }
  .bracket.tr { top: 8px; right: 8px; border-top-width: 2px; border-right-width: 2px; }
  .bracket.bl { bottom: 8px; left: 8px; border-bottom-width: 2px; border-left-width: 2px; }
  .bracket.br { bottom: 8px; right: 8px; border-bottom-width: 2px; border-right-width: 2px; }
  .hud { position: absolute; z-index: 4; font-family: var(--f-data); font-size: 11px; letter-spacing: 0.08em; color: rgba(233,237,248,0.85); text-transform: uppercase; pointer-events: none; text-shadow: 0 1px 2px #000; }
  .hud.tl { top: 13px; left: 36px; }
  .hud.tr { top: 13px; right: 36px; text-align: right; }
  .labels { position: absolute; inset: 0; z-index: 5; pointer-events: none; }
  /* The answer, lettered on a pixel-cornered nameplate above the flag that drawMarker plants on the canvas.
     Opaque, square, no blur: a 1px light edge inside a 1px ink line (stepped at the corners), the tier colour as a 2px cap. */
  .claim {
    --edge: #e4e7f6;
    --line: #04050f;
    position: absolute;
    box-sizing: border-box;
    min-width: 30px;
    padding: 4px 8px 3px;
    background: linear-gradient(180deg, #19204c 0%, #0c1131 55%, #080b23 100%);
    box-shadow:
      0 -1px 0 var(--edge), 0 1px 0 var(--edge), -1px 0 0 var(--edge), 1px 0 0 var(--edge),
      -1px -1px 0 var(--line), 1px -1px 0 var(--line), -1px 1px 0 var(--line), 1px 1px 0 var(--line),
      0 -2px 0 var(--line), 0 2px 0 var(--line), -2px 0 0 var(--line), 2px 0 0 var(--line),
      inset 0 2px 0 var(--cls), inset 0 3px 0 rgba(0,0,0,0.4),
      0 4px 0 rgba(0,0,0,0.35);
    color: #fff;
    font-family: var(--f-body);
    font-weight: 700;
    font-size: 12.5px;
    line-height: 16px;
    letter-spacing: 0.015em;
    text-shadow: 0 1px 0 #000;
    overflow: hidden;
    animation: claim-print 0.24s steps(6, end) 0.34s backwards;
  }
  .claim.to-right { animation-name: claim-print-r; }
  .claim-text { display: block; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; unicode-bidi: plaintext; }
  .claim.is-top { --edge: var(--cls); background: linear-gradient(180deg, #2a2340 0%, #120f2c 55%, #0b0a22 100%); }
  .claim.is-top::after {
    content: ""; position: absolute; top: 0; bottom: 0; left: 0; width: 40%; pointer-events: none;
    background: linear-gradient(100deg, transparent, rgba(255,236,190,0.22) 50%, transparent);
    transform: translateX(-120%);
    animation: claim-sheen 2.6s ease-in-out 0.7s infinite;
  }
  .claim.is-off::after { background: linear-gradient(100deg, transparent, rgba(255,200,235,0.24) 50%, transparent); }
  /* the plate's tail: a stepped pixel point aimed down at the flag's finial */
  .claim-tail { position: absolute; width: 7px; height: 4px; transform: translateX(-50%); animation: claim-wait 0.01s 0.34s backwards; }
  .claim-tail::before, .claim-tail::after { content: ""; position: absolute; inset: 0; }
  .claim-tail::before { background: #04050f; clip-path: polygon(0 0, 7px 0, 7px 1px, 6px 1px, 6px 2px, 5px 2px, 5px 3px, 4px 3px, 4px 4px, 3px 4px, 3px 3px, 2px 3px, 2px 2px, 1px 2px, 1px 1px, 0 1px); }
  .claim-tail::after { background: #e4e7f6; clip-path: polygon(1px 0, 6px 0, 6px 1px, 5px 1px, 5px 2px, 4px 2px, 4px 3px, 3px 3px, 3px 2px, 2px 2px, 2px 1px, 1px 1px); }
  .claim-tail.is-top::after { background: var(--cls); }
  /* prints in from the pole end in 6 hard steps */
  @keyframes claim-print { from { clip-path: inset(-3px -3px -6px 100%); } to { clip-path: inset(-3px -3px -6px -3px); } }
  @keyframes claim-print-r { from { clip-path: inset(-3px 100% -6px -3px); } to { clip-path: inset(-3px -3px -6px -3px); } }
  @keyframes claim-wait { from, to { visibility: hidden; } }
  @keyframes claim-sheen { 0% { transform: translateX(-120%); } 40%, 100% { transform: translateX(320%); } }
  /* the flight log pastes this layer over a still of the canvas: show it settled, no replay */
  .chart .claim, .chart .claim-tail, .chart .claim::after { animation: none; }
  @media (prefers-reduced-motion: reduce) { .claim, .claim.to-right, .claim-tail, .claim.is-top::after { animation: none; } }
  @keyframes tag-in { from { opacity: 0; transform: translate(-50%, 4px); } to { opacity: 1; transform: translate(-50%, 0); } }
  .caption {
    position: absolute; z-index: 6; left: 50%; bottom: 14%; transform: translateX(-50%);
    width: max-content; max-width: 86%;
    text-align: center;
    padding: 6px 12px;
    border-radius: 6px;
    background: rgba(7,10,28,0.8);
    border: 1px solid var(--rule);
    animation: tag-in 0.4s ease-out both;
  }
  .caption b { display: block; font-family: var(--f-display); font-weight: 400; font-size: 13px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--flare-hi); }
  .caption span { font-size: 14px; color: var(--ink); }
  .skip-hint { position: absolute; z-index: 6; right: 12px; bottom: 10px; font-family: var(--f-data); font-size: 11px; color: var(--ink-dim); background: none; border: 0; padding: 4px; }

  .signal { width: var(--scope); max-width: 100%; display: flex; align-items: center; gap: 10px; }
  .signal-track { flex: 1; height: 6px; border-radius: 3px; background: var(--deck-2); overflow: hidden; }
  .signal-fill { height: 100%; width: 100%; background: linear-gradient(90deg, var(--flare), var(--flare-hi)); transform-origin: left center; }
  .signal-fill.is-low { background: var(--alert); }
  .signal-num { font-family: var(--f-data); font-weight: 700; font-size: 14px; min-width: 3ch; text-align: right; font-variant-numeric: tabular-nums; color: var(--ink); }
  .signal.is-off { visibility: hidden; }

  /* ---------- console ---------- */
  .console { width: 100%; max-width: 620px; display: flex; flex-direction: column; gap: 12px; }
  .card {
    background: linear-gradient(180deg, var(--deck-2), var(--deck));
    border: 1px solid var(--rule);
    border-radius: 12px;
    padding: 14px 18px 16px;
  }
  .eyebrow {
    margin: 0 0 6px;
    display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    font-family: var(--f-display); font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase;
    color: var(--flare-hi);
  }
  .eyebrow span:last-child { color: var(--ink-dim); }
  .prompt { margin: 0; font-size: clamp(21px, 4.6vw, 27px); line-height: 1.22; font-weight: 700; text-wrap: balance; }
  .answer-row { display: flex; gap: 8px; }
  .answer-row input {
    flex: 1; min-width: 0;
    background: #050816;
    border: 1.5px solid var(--rule);
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 18px;
  }
  .answer-row input::placeholder { color: #8389b6; }
  .answer-row input:focus { outline: none; border-color: var(--flare-hi); box-shadow: 0 0 0 3px rgba(255,179,107,0.18); }
  .answer-row input:disabled { opacity: 0.55; }
  .btn, .btn-line {
    font-family: var(--f-display); font-size: 13px; letter-spacing: 0.16em; text-transform: uppercase;
    border-radius: 10px; padding: 12px 16px; white-space: nowrap;
  }
  .btn { background: var(--flare); color: #1b0b02; border: 0; box-shadow: 0 3px 0 #a8461a; }
  .btn:hover { background: #ff8b55; }
  .btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #a8461a; }
  .btn:disabled { filter: grayscale(0.8) brightness(0.7); cursor: default; }
  .btn-line { background: transparent; color: var(--flare-hi); border: 1.5px solid var(--rule); }
  .btn-line:hover { border-color: var(--flare-hi); }
  .btn-wide { width: 100%; padding: 15px 18px; font-size: 14px; }
  .feedback { margin: 0; min-height: 1.45em; text-align: center; font-size: 15px; color: var(--ink-dim); }
  .feedback.is-error { color: var(--alert); }
  .feedback.is-busy { color: var(--flare-hi); }

  .find-card { border-color: color-mix(in srgb, var(--cls) 55%, var(--rule)); overflow: hidden; } /* a name stamps in from bigger than it ends up */
  .find-card .eyebrow span:first-child { color: var(--cls); }
  .find-name { margin: 0; font-size: clamp(22px, 5vw, 30px); font-weight: 700; line-height: 1.15; overflow-wrap: anywhere; }
  .find-line { margin: 6px 0 0; color: var(--ink-dim); }
  .ladder-mini { display: flex; gap: 6px; margin-top: 12px; }
  .ladder-mini span {
    flex: 1; text-align: center;
    font-family: var(--f-data); font-size: 11px; letter-spacing: 0.04em;
    padding: 4px 0; border-radius: 6px;
    color: var(--ink-dim); background: var(--deck); border: 1px solid var(--rule);
  }
  .ladder-mini span.is-hit { color: #0b0d1c; background: var(--cls); border-color: var(--cls); font-weight: 700; }
  .note { margin: 8px 0 0; font-size: 14px; color: var(--ink-dim); }
  .note.is-first { color: #ff8fcd; }
  .note.is-power { color: var(--flare-hi); }
  .note.is-drain { color: var(--alert); }

  /* home */
  .title {
    margin: 0;
    font-family: var(--f-display);
    font-weight: 400;
    font-size: clamp(34px, 9.5vw, 62px);
    letter-spacing: 0.14em;
    line-height: 1;
    color: var(--ink);
    text-align: center;
  }
  .title em { font-style: normal; color: var(--flare); }
  .lede { margin: 8px auto 0; max-width: 44ch; text-align: center; text-wrap: balance; }
  .modes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .mode {
    text-align: left; background: var(--deck); border: 1.5px solid var(--rule); border-radius: 12px;
    padding: 12px 14px; display: flex; flex-direction: column; gap: 3px;
  }
  .mode:hover { border-color: var(--flare-hi); }
  .mode-name { font-family: var(--f-display); font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--flare-hi); }
  .mode-desc { font-size: 14px; color: var(--ink-dim); }
  .mode-desc b { color: var(--ink); }
  .mode.is-done .mode-name { color: var(--ink-dim); }
  .section-title { margin: 0 0 10px; font-family: var(--f-display); font-weight: 400; font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--flare-hi); }
  .route { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .node {
    width: 100%; height: 100%;
    display: grid; grid-template-columns: 34px 1fr; align-items: center; gap: 8px;
    text-align: left; padding: 8px 10px; border-radius: 10px;
    background: var(--deck); border: 1.5px solid var(--rule);
  }
  .node img { width: 34px; height: 34px; image-rendering: pixelated; }
  .node-name { display: block; font-size: 14px; font-weight: 700; line-height: 1.15; }
  .node-meta { display: block; font-family: var(--f-data); font-size: 11px; color: var(--ink-dim); }
  .node .stars { color: var(--flare-hi); letter-spacing: 0.08em; }
  .node.is-selected { border-color: var(--flare-hi); background: var(--deck-2); }
  .node.is-locked { opacity: 0.5; cursor: not-allowed; }
  .node:not(.is-locked):hover { border-color: var(--flare); }
  .legend { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
  .legend li { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .legend img { width: 40px; height: 40px; image-rendering: pixelated; }
  .legend b { font-size: 13px; color: var(--cls); }
  .legend span { font-family: var(--f-data); font-size: 11px; color: var(--ink-dim); }
  .legend-note { margin: 10px 0 0; font-size: 14px; color: var(--ink-dim); }
  .foot { margin: 0; font-size: 13px; color: var(--ink-dim); text-align: center; text-wrap: balance; }
  .foot b { color: var(--ink); }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; background: var(--ink-dim); }
  .dot.is-on { background: #7dffa8; box-shadow: 0 0 6px #7dffa8; }
  .dot.is-off { background: var(--alert); }

  .brief-fact { margin: 6px 0 0; font-size: 16px; }
  .brief-rules { margin: 8px 0 0; font-family: var(--f-data); font-size: 12px; color: var(--ink-dim); }

  @media (max-width: 560px) {
    .route { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .btn, .btn-line { white-space: normal; letter-spacing: 0.1em; padding-inline: 10px; }
    .tally span { font-size: 10px; }
    .legend img { width: 32px; height: 32px; }
    .answer-row { flex-wrap: wrap; }
    .answer-row input { flex-basis: 100%; }
    .answer-row button { flex: 1; }
    .modes { grid-template-columns: 1fr; }
    .brand { font-size: 11px; letter-spacing: 0.14em; }
    .bar { grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px; }
    .pips { gap: 3px; overflow: hidden; }
    .pip { width: 9px; height: 9px; }
    .cell { width: 4px; height: 14px; }
    .pips-label { display: none; }
    .bar-right { gap: 4px; }
    .icon-btn { width: 32px; height: 32px; position: relative; }
    /* a 44 px tall target round each 32 px button, as wide as the gaps beside it allow: the header has no width to spare.
       Measured from inside the border, so 7.5 px reaches about 6 px past the button, and 3 px half the gap beside it */
    .icon-btn::before { content: ""; position: absolute; inset: -7.5px; }
    .bar-right .icon-btn::before { inset: -7.5px -3px; }
    .bar-right .icon-btn:first-of-type::before { left: -7.5px; }
    .bar-right .icon-btn:last-child::before { right: -11.5px; }
    .readout { font-size: 16px; }
  }
  /* on a 375 px phone the eight pips fit between the name and the readout instead of running into both */
  @media (max-width: 400px) {
    .pips { gap: 2px; }
    .pip { width: 8px; height: 8px; border-radius: 2px; }
    .pip.is-miss::after { left: 1px; right: 1px; top: 3px; }
  }

  /* route and flight pieces */
  .reach { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 6px; }
  .reach li { aspect-ratio: 1; border-radius: 8px; overflow: hidden; background: var(--deck); border: 1px solid var(--rule); }
  .reach img { width: 100%; height: 100%; display: block; image-rendering: pixelated; opacity: 0.32; filter: grayscale(0.85); }
  .reach li.is-reached img { opacity: 1; filter: none; }
  .reach li.is-best { border-color: var(--flare-hi); box-shadow: 0 0 0 1px var(--flare-hi), 0 0 12px rgba(255,179,107,0.35); }
  .dest { display: flex; gap: 10px; align-items: flex-start; margin: 12px 0 0; font-size: 14px; color: var(--ink-dim); }
  .dest img { width: 40px; height: 40px; flex: none; border-radius: 6px; image-rendering: pixelated; }
  .dest b { color: var(--ink); }
  .route-line { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px 4px; align-items: center; justify-content: center; }
  .route-line li { display: flex; align-items: center; gap: 6px; font-size: 13px; }
  .route-line li + li::before { content: ""; width: 10px; height: 2px; margin-right: 2px; background: var(--flare-hi); }
  .route-line img { width: 24px; height: 24px; border-radius: 5px; image-rendering: pixelated; }
  .seal-num { font-family: var(--f-data); font-weight: 700; font-size: 40px; line-height: 1; color: var(--flare-hi); }
  .seal-num small { font-size: 14px; font-weight: 400; color: var(--ink-dim); }
  .seal-best { display: inline-block; margin-top: 6px; padding: 2px 8px; border-radius: 3px; background: var(--flare-hi); color: #1b0b02; font-family: var(--f-display); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; }
  .sum-fact { margin: 0; text-align: center; color: var(--ink-dim); font-size: 15px; text-wrap: balance; }
  .btn-small { padding: 4px 10px; font-size: 11px; margin-left: 6px; }
  .ladder-mini span { line-height: 1.2; padding: 4px 2px; }
  @media (max-width: 560px) { .reach { gap: 4px; } .legend { grid-template-columns: repeat(5, minmax(0, 1fr)); } .legend b { font-size: 11px; } }

  .console > #btn-next { position: sticky; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); z-index: 2; box-shadow: 0 3px 0 #a8461a, 0 -14px 18px var(--void); }
  .icon-btn.is-armed { background: var(--alert); border-color: var(--alert); color: #1b0b02; }
  .skip-hint { background: rgba(7,10,28,0.8); border: 1px solid var(--rule); border-radius: 6px; color: var(--ink); padding: 8px 12px; min-height: 32px; }
  .hud { background: rgba(7,10,28,0.7); padding: 1px 6px; border-radius: 4px; }
  .find-name { unicode-bidi: plaintext; }
  .sheet { overscroll-behavior: contain; }

  /* distance and answer depth */
  .hud.bc { bottom: 13px; left: 36px; white-space: nowrap; color: var(--ink); font-weight: 700; }
  .hud:empty { display: none; }
  /* the row of thrust cells to the next stop; cells this burn added pop in, in the tier colour */
  .hud .cells { display: inline-flex; gap: 2px; vertical-align: middle; }
  .hud .cell { width: 5px; height: 10px; border-radius: 1px; }
  .hud .cell.is-new { background: var(--cls); animation: cell-pop 0.35s both; }
  @keyframes cell-pop { from { transform: scaleY(0.2); opacity: 0; } 60% { transform: scaleY(1.25); } to { transform: none; opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .hud .cell.is-new { animation: none; } }
  @media (max-width: 560px) { .hud .cell { width: 4px; height: 9px; } }
  .log-cells { margin: 4px 0 0; color: var(--ink-dim); font-size: 14px; }
  .miles { margin: 10px 0 0; display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; font-size: 14px; color: var(--ink-dim); }
  .miles b { font-family: var(--f-data); font-size: 20px; color: var(--ink); }
  .miles-main { white-space: nowrap; }
  .miles-gain { flex-basis: 100%; font-family: var(--f-data); font-size: 12px; color: var(--cls); }
  .rarity { margin-top: 12px; }
  .rarity-ends { display: flex; justify-content: space-between; margin-bottom: 4px; font-size: 11px; color: var(--ink-dim); }
  /* the gauge: a segment per tier, faint until lit; passed tiers dim, the answer's tier in full colour */
  .rarity-track { position: relative; height: 10px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 3px; }
  .rarity-track .seg { border-radius: 2px; background: color-mix(in srgb, var(--seg) 14%, transparent); box-shadow: inset 0 0 0 1px var(--rule); }
  .rarity-track .seg.is-on { background: color-mix(in srgb, var(--seg) 45%, #0b0d1c); box-shadow: none; }
  .rarity-track .seg.is-at { background: var(--seg); box-shadow: none; }
  .rarity-track b { position: absolute; top: 50%; width: 14px; height: 14px; border: 2px solid #0b0d1c; background: var(--cls); transform: translate(-50%, -50%) rotate(45deg); }
  /* the lock-in beat before a burn: the answer stamps in, the gauge climbs a tier at a time and locks with a jolt */
  .find-card.is-lock:focus { outline: none; }
  .is-lock .find-name { transform-origin: 0 50%; animation: name-stamp 0.14s ease-out both; }
  .is-lock:not(.is-landed) .rarity-track b { visibility: hidden; }
  .is-lock .seg.is-at { animation: seg-step 0.16s ease-out; }
  .is-lock.is-landed .seg.is-at { animation: seg-land 0.3s cubic-bezier(0.3, 1.6, 0.5, 1); }
  .is-lock .rarity-scale .is-hit { color: var(--seg); }
  @keyframes name-stamp { from { transform: scale(1.22); opacity: 0; } }
  @keyframes seg-step { from { transform: scaleY(1.8); } }
  @keyframes seg-land { from { transform: scaleY(2.4); } }
  .rarity-scale { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 3px; margin-top: 6px; font-family: var(--f-data); font-size: 11px; line-height: 1.2; text-align: center; color: var(--ink-dim); }
  .rarity-scale .is-hit { color: var(--cls); font-weight: 700; }
  .log-miles { margin: -6px 0 0; font-family: var(--f-data); font-weight: 700; font-size: clamp(20px, 5.4vw, 28px); line-height: 1.2; color: var(--flare-hi); }
  @media (prefers-reduced-motion: reduce) { .is-lock .find-name, .is-lock .seg.is-at { animation: none; } }
  @media (max-height: 700px) { .console > #btn-next { position: static; } }
  @media (max-width: 420px) {
    .rarity-scale span:not(.is-hit) { visibility: hidden; max-height: 0; overflow: hidden; } /* only the answer's tier is named, so the rest take no height */
    .rarity-scale .is-hit { white-space: nowrap; }
    .rarity-scale .is-hit:first-child { justify-self: start; }
    .rarity-scale .is-hit:last-child { justify-self: end; }
  }

  /* ---------- mission log ---------- */
  .sheet {
    position: fixed; inset: 0; z-index: 20;
    overflow-y: auto;
    background: rgba(4, 6, 18, 0.94);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: calc(20px + env(safe-area-inset-top, 0px)) calc(28px + env(safe-area-inset-bottom, 0px));
  }
  .sheet-inner { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
  .log-head { display: grid; grid-template-columns: 1fr auto; align-items: end; gap: 12px; }
  .log-title { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: clamp(20px, 5vw, 28px); letter-spacing: 0.1em; text-transform: uppercase; line-height: 1.15; }
  .log-sub { margin: 4px 0 0; color: var(--ink-dim); }
  .seal { text-align: right; }
  .seal-stars { font-size: 30px; letter-spacing: 0.06em; color: var(--flare-hi); line-height: 1; }
  .seal-stars .off { color: var(--rule); }
  .seal-pts { font-family: var(--f-data); font-size: 14px; color: var(--ink); }
  .chart { position: relative; width: 100%; aspect-ratio: 1; max-width: 420px; margin: 0 auto; border-radius: 8px; overflow: hidden; box-shadow: 0 0 0 1px var(--rule); }
  .chart img { width: 100%; height: 100%; display: block; }
  .unlock { text-align: center; padding: 10px 14px; border-radius: 10px; border: 1px dashed var(--flare-hi); color: var(--flare-hi); font-weight: 700; }
  .tally { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
  .tally div { text-align: center; background: var(--deck); border: 1px solid var(--rule); border-radius: 10px; padding: 8px 2px; }
  .tally b { display: block; font-family: var(--f-data); font-size: 22px; color: var(--cls); }
  .tally span { font-size: 12px; color: var(--ink-dim); }
  .log-actions { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 8px; }

  @media (prefers-reduced-motion: reduce) {
    .caption { animation: none; }
  }

  /* ---------- points and the hangar ---------- */
  #hangar { z-index: 22; }
  #help { z-index: 24; }
  .pts-chip { margin-left: 8px; padding: 1px 7px; border-radius: 3px; background: rgba(255,179,107,0.16); color: var(--flare-hi); font-family: var(--f-data); font-size: 11px; letter-spacing: 0; text-transform: none; white-space: nowrap; }
  .pts-chip.is-dim { background: var(--deck); color: var(--ink-dim); }
  .pts-bar { display: block; height: 6px; border-radius: 3px; background: var(--deck-2); box-shadow: inset 0 0 0 1px var(--rule); overflow: hidden; }
  .pts-bar i { display: block; height: 100%; border-radius: 3px; background: linear-gradient(90deg, var(--flare), var(--flare-hi)); }
  .hangar-btn { display: grid; grid-template-columns: 60px minmax(0, 1fr); align-items: center; gap: 12px; }
  .hangar-btn img { width: 60px; height: 60px; }
  .hangar-txt { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .hangar-txt .pts-bar { margin-top: 3px; }
  .hangar-count { margin-left: 8px; color: var(--ink-dim); }
  .new-lamp { display: inline-block; margin-left: 10px; padding: 1px 6px; border-radius: 3px; background: #ff5fb8; color: #1b0216; font-family: var(--f-data); font-size: 10px; font-weight: 700; letter-spacing: 0; text-transform: none; vertical-align: 2px; }
  .new-dot { display: inline-block; width: 8px; height: 8px; margin-left: 8px; border-radius: 50%; background: #ff5fb8; box-shadow: 0 0 8px #ff5fb8; vertical-align: 1px; }
  .pts-line { margin: 0; text-align: center; color: var(--ink-dim); }
  .pts-line b { margin-right: 2px; font-family: var(--f-data); font-size: 18px; color: var(--flare-hi); }
  .pts-next { width: 100%; max-width: 420px; margin: 0 auto; display: grid; grid-template-columns: 44px minmax(0, 1fr); align-items: center; gap: 10px; }
  .pts-next img { width: 44px; height: 44px; }
  .pts-next p { margin: 0 0 5px; font-size: 13px; color: var(--ink-dim); }
  .rk-new { display: grid; grid-template-columns: 96px minmax(0, 1fr); align-items: center; gap: 14px; border-color: var(--rar); box-shadow: 0 0 0 1px var(--rar), 0 0 24px color-mix(in srgb, var(--rar) 30%, transparent); }
  .rk-new img { width: 96px; height: 96px; }
  .rk-new .eyebrow span:last-child { color: var(--rar); }
  .rk-title { margin: 0; font-size: 20px; line-height: 1.2; }
  .rk-flavor { margin: 4px 0 0; font-size: 14px; color: var(--ink-dim); }
  .rk-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .rk-actions .btn-small { margin-left: 0; padding: 7px 14px; }
  .rk-show { text-align: center; border-color: color-mix(in srgb, var(--rar) 60%, var(--rule)); }
  .rk-show .eyebrow { justify-content: center; gap: 14px; }
  .rk-show .eyebrow span:first-child { color: var(--rar); }
  .rk-show canvas { display: block; width: 100%; aspect-ratio: 8 / 3; margin: -2px 0 8px; }
  .rk-show .btn { margin-top: 14px; }
  .rk-show .pts-bar { max-width: 320px; margin: 14px auto 0; }
  .rk-need { margin: 6px 0 0; font-size: 13px; color: var(--ink-dim); }
  .rk-show .btn:disabled, .rk-actions .btn:disabled { filter: none; background: transparent; color: #7dffa8; box-shadow: inset 0 0 0 1.5px rgba(125,255,168,0.45); }
  .rk-grid { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
  .rk-tile { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 4px 10px; border-radius: 12px; background: var(--deck); border: 1.5px solid color-mix(in srgb, var(--rar) 40%, var(--rule)); color: var(--ink); }
  .rk-tile img { width: 64px; height: 64px; }
  .rk-tile:hover { border-color: var(--rar); }
  .rk-tile.is-viewing { background: var(--deck-2); border-color: var(--rar); box-shadow: 0 0 0 1px var(--rar), 0 0 16px color-mix(in srgb, var(--rar) 28%, transparent); }
  .rk-name { min-height: 2.3em; display: flex; align-items: center; font-size: 12px; font-weight: 700; line-height: 1.15; text-align: center; }
  .rk-cost { display: inline-flex; align-items: center; gap: 4px; font-family: var(--f-data); font-size: 11px; color: var(--rar); }
  .rk-cost .lock { width: 11px; height: 11px; }
  .rk-tile.is-locked .rk-name, .rk-tile.is-locked .rk-cost { color: var(--ink-dim); }
  .rk-tile.is-selected .rk-cost { color: #7dffa8; }
  @media (max-width: 560px) {
    .rk-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .rk-new { grid-template-columns: 72px minmax(0, 1fr); }
    .rk-new img { width: 72px; height: 72px; }
  }

  /* ---------- payload bay: the switches that choose what free flights carry ---------- */
  .bay { background: var(--deck); border: 1.5px solid var(--rule); border-radius: 12px; }
  .bay-title { margin: 0; font-size: inherit; font-weight: 400; }
  .bay-head { width: 100%; min-height: 48px; display: flex; align-items: center; gap: 8px; padding: 12px 12px 12px 14px; background: none; border: 0; border-radius: 10px; text-align: left; }
  .bay-sum { flex: 1; min-width: 0; text-align: right; font-size: 14px; color: var(--ink-dim); text-wrap: balance; }
  /* switches get flipped in quick runs: no double-tap zoom */
  .bay-head, .bay-sw { touch-action: manipulation; }
  .bay-chev { flex: none; width: 18px; height: 18px; color: var(--flare-hi); transition: transform 0.2s ease-out; }
  .bay-head[aria-expanded="true"] .bay-chev { transform: rotate(180deg); }
  .bay-body { padding: 0 12px 12px; }
  .bay-note { margin: 0 2px; padding-top: 12px; border-top: 1px solid var(--rule); font-size: 14px; color: var(--ink-dim); }
  .bay-label { margin: 14px 2px 8px; font-family: var(--f-display); font-weight: 400; font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--ink-dim); }
  .bay-grid { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .bay-grid.is-packs { grid-template-columns: minmax(0, 1fr); }
  .bay-sw { width: 100%; height: 100%; min-height: 52px; display: grid; grid-template-columns: 20px minmax(0, 1fr); align-items: center; gap: 8px; padding: 8px; text-align: left; border-radius: 10px; background: #0a0e26; border: 1px solid var(--rule); }
  .is-packs .bay-sw { align-items: start; }
  .bay-txt { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
  .bay-name { font-size: 14px; font-weight: 700; line-height: 1.2; color: var(--ink); }
  .bay-meta { font-family: var(--f-data); font-size: 11px; color: var(--ink-dim); }
  .bay-blurb { margin-top: 3px; font-size: 13px; line-height: 1.35; color: var(--ink-dim); }
  .bay-sw[aria-checked="false"] .bay-name { color: var(--ink-dim); }
  .bay-sw.is-held .bay-meta { color: var(--flare-hi); }
  /* a rocker in a recessed bezel: the raised end catches the light, and the lens on its upper end lights when on */
